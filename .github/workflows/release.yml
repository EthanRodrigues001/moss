name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci
        working-directory: ui
      - shell: bash
        run: node scripts/bump-version.mjs --check "${GITHUB_REF_NAME}"
      - shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          dir=target/release/bundle/nsis
          exe=$(ls $dir/*-setup.exe); sig="$exe.sig"
          ver="${GITHUB_REF_NAME#v}"
          name=$(basename "$exe")
          gh release create "$GITHUB_REF_NAME" "$exe" "$sig" --prerelease --title "Moss $ver" --notes "Unsigned beta. Windows SmartScreen may warn: choose More info, then Run anyway." || gh release upload "$GITHUB_REF_NAME" "$exe" "$sig" --clobber
          node -e '
            const fs=require("fs");
            const [,,ver,name,sig,tag]=process.argv;
            fs.writeFileSync("latest.json",JSON.stringify({version:ver,notes:"",pub_date:new Date().toISOString(),platforms:{"windows-x86_64":{signature:fs.readFileSync(sig,"utf8").trim(),url:`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`}}}));
          ' "$ver" "$name" "$sig" "$GITHUB_REF_NAME"
          gh release view updater >/dev/null 2>&1 || gh release create updater --prerelease --title "Updater feed" --notes "Read by the app. Do not delete."
          gh release upload updater latest.json --clobber
