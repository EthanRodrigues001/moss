[package]
name = "moss-core"
description = "Shared Moss logic: projects, TeX detection, compile, sync, history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
keyring = { version = "3", features = ["windows-native"] }
png = "0.18"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
similar = "3.2.1"
tempfile = "3"
thiserror.workspace = true
tungstenite = { version = "0.30.0", features = ["native-tls"] }
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
