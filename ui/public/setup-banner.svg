<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
    <linearGradient id="moss-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#1d1d21"/>
    </linearGradient>
    <linearGradient id="moss-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555d"/>
      <stop offset="1" stop-color="#3a3a41"/>
    </linearGradient>
    <linearGradient id="moss-paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#d6dce9"/>
    </linearGradient>
    <linearGradient id="moss-back" gradientUnits="userSpaceOnUse" x1="212" y1="300" x2="284" y2="238">
      <stop offset="0" stop-color="#c9d1e3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="moss-sigma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2858dc"/>
    </linearGradient>
    <filter id="moss-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="moss-blur-s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    
    <clipPath id="moss-onpaper"><path d="M150 -120H660V360H270L150 230Z"/></clipPath>
  <clipPath id="bn"><rect width="1200" height="300"/></clipPath>
<radialGradient id="vig" cx="0.2" cy="0.5" r="0.9"><stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient></defs>
<rect width="1200" height="300" fill="url(#moss-base)"/>
<rect width="1200" height="300" fill="url(#vig)"/>
<g clip-path="url(#bn)"><g transform="translate(640 -40) scale(0.95) rotate(0 256 256)"><g transform="rotate(-14 256 256)">
      <!-- the grey sheet is only a margin: the paper's own outline, grown by a fixed width, so it follows every edge, the crease included -->
      <path d="M150 -120H660V360H270L150 230Z" fill="#9a9aa6" fill-opacity=".38" stroke="#9a9aa6" stroke-opacity=".38" stroke-width="102" stroke-linejoin="round"/>
      <path d="M150 -120H660V360H270L150 230Z" fill="url(#moss-mid)" stroke="url(#moss-mid)" stroke-width="98" stroke-linejoin="round"/>
      <!-- the paper's shadow on the margin -->
      <path d="M150 -120H660V360H270L150 230Z" transform="translate(-4 14)" fill="#000" opacity=".45" filter="url(#moss-blur)"/>
      <!-- paper -->
      <path d="M150 -120H660V360H270L150 230Z" fill="url(#moss-paper)" stroke="url(#moss-paper)" stroke-width="10" stroke-linejoin="round"/>
      <g clip-path="url(#moss-onpaper)">
        <path d="M120 8H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 54H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 100H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 146H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 192H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 238H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 284H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 330H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/><path d="M120 376H680" stroke="#cdd3e0" stroke-width="4" stroke-linecap="round"/>
        <!-- the formula -->
        <path d="M430 130H320L375 200L320 270H430" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" transform="translate(3 9)" filter="url(#moss-blur-s)"/>
        <path d="M430 130H320L375 200L320 270H430" fill="none" stroke="url(#moss-sigma)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- the peeled corner: its shadow, then the back of the paper -->
      <path d="M150 230L279.6 240.4L270 360Z" transform="translate(-3 12)" fill="#000" opacity=".38" filter="url(#moss-blur-s)"/>
      <path d="M150 230L279.6 240.4L270 360Z" fill="url(#moss-back)" stroke="url(#moss-back)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M150 230L270 360" stroke="#aab3c8" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g></g>
</svg>