<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moss Connector</title>
    <style>
      :root { color-scheme: dark; }
      body {
        width: 300px; margin: 0; padding: 16px;
        background: #0a0a0a; color: #f5f5f5;
        font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #818181; }
      input {
        box-sizing: border-box; width: 100%; padding: 8px 10px; margin-bottom: 10px;
        background: #111; color: #f5f5f5; border: 1px solid #1e1e1e; border-radius: 8px;
        font: 600 18px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 6px;
        text-align: center; outline: none;
      }
      input:focus { border-color: #346bf1; box-shadow: 0 0 0 3px rgb(52 107 241 / 0.3); }
      button {
        width: 100%; padding: 9px 12px; border: 1px solid rgb(52 107 241 / 0.7); border-radius: 8px;
        background: #346bf1; color: #fff; font: 600 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.18), 0 1px 2px rgb(0 0 0 / 0.35); cursor: pointer;
      }
      button:hover { background: #3061d9; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 10px; min-height: 18px; }
      .ok { color: #34d399; } .bad { color: #ff6467; }
    </style>
  </head>
  <body>
    <h1>Moss Connector</h1>
    <p>In Moss, choose <b>Import from Overleaf &rarr; Connect from Chrome</b>, then type the 6-digit code it shows.</p>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="······" autofocus />
    <button id="send">Send Overleaf sign-in to Moss</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
