[workspace]
resolver = "3"
members = ["crates/moss-core", "crates/moss-mcp", "src-tauri"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Ethan Rodrigues"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Debug builds were filling the disk: full debug info made `target` grow to ~24 GB
# (PDB files alone were ~4 GB). Line tables keep backtraces readable; dependencies
# get none, since nobody steps through them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
